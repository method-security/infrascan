# Active Association Validation for Wireless Access Points
# Confirms that an SSID/AP actually enforces the advertised security and expected
# access controls using a designated test client profile.
#
# Category: challenge/validation (authorized, controlled)
# Purpose: Attempt to associate/connect using a permitted test identity
# and collect high-level outcomes without credential guessing or disruption.

imports:
    wireless: ../common/wireless.yml

types:
    # =============================================================================
    # 802.11 STATUS CODES (IEEE 802.11-2020)
    # =============================================================================
    AssociationStatusCode:
        docs: |
            Standard 802.11 Status Codes for association/authentication frames.
            Using these allows the ontology to distinguish between credential failures
            and protocol mismatches.
        enum:
            - SUCCESS
            - UNSPECIFIED_FAILURE
            - CAPABILITY_NOT_SUPPORTED
            - REASSOCIATION_DENIED
            - ASSOCIATION_DENIED
            - AUTH_ALGO_NOT_SUPPORTED
            - AUTH_SEQ_OUT_OF_ORDER
            - CHALLENGE_FAILURE
            - AUTH_TIMEOUT
            - AP_RESOURCE_CONSTRAINED
            - ASSOC_DENIED_RATES
            - ASSOC_DENIED_NO_SHORT_PREAMBLE
            - ASSOC_DENIED_NO_PBCC
            - ASSOC_DENIED_NO_CHANNEL_AGILITY
            - ASSOC_DENIED_NO_SPECTRUM_MGMT
            - ASSOC_DENIED_BAD_POWER_CAP
            - ASSOC_DENIED_BAD_SUPPORTED_CHANNELS
            - ASSOC_DENIED_NO_SHORT_SLOT
            - ASSOC_DENIED_NO_DSSS_OFDM
            - ASSOC_DENIED_NO_HT
            - R0KH_UNREACHABLE
            - CIPHER_REJECTED_BY_POLICY
            - TS_NOT_CREATED
            - DIRECT_LINK_NOT_ALLOWED
            - DEST_STA_NOT_PRESENT
            - DEST_STA_NOT_QOS_STA
            - ASSOC_DENIED_LISTEN_INT_TOO_LARGE
            - INVALID_FT_ACTION_FRAME_COUNT
            - INVALID_PMKID
            - INVALID_MDE
            - INVALID_FTE
            - TRANSMISSION_FAILURE
            - REQUESTED_TCLAS_NOT_SUPPORTED
            - TCLAS_RESOURCES_EXHAUSTED
            - REJECTED_WITH_SUGGESTED_BSS_TRANSITION
            - REJECT_WITH_SCHEDULE
            - REJECT_NO_WAKEUP_SPECIFIED
            - SUCCESS_POWER_SAVE_MODE
            - PENDING_ADMITTING_FST_SESSION
            - PERFORMING_FST_NOW
            - PENDING_GAP_IN_BA_WINDOW
            - REJECT_U_PID_SETTING
            - ANTI_CLOGGING_TOKEN_REQUIRED
            - FINITE_CYCLIC_GROUP_NOT_SUPPORTED
            - CANNOT_FIND_ALTERNATIVE_TBTT
            - TRANSMISSION_FAILURE_2
            - REQUESTED_TCLAS_NOT_SUPPORTED_2
            - TCLAS_RESOURCES_EXHAUSTED_2
            - REFUSED_REASON_UNSPECIFIED
            - SAE_HASH_TO_ELEMENT
            - REFUSED_AP_OUT_OF_MEMORY
            - DENIED_DUE_TO_SSID_RESTRICTION
            - DENIED_DUE_TO_AUTHORIZATION
            - TIMEOUT
            - UNKNOWN

    # =============================================================================
    # EAP METHOD TYPES
    # =============================================================================
    EapMethod:
        docs: |
            EAP methods used in WPA-Enterprise authentication.
            Captured to identify protocol negotiation outcomes.
        enum:
            - EAP_TLS
            - EAP_TTLS
            - PEAP
            - EAP_FAST
            - EAP_SIM
            - EAP_AKA
            - EAP_AKA_PRIME
            - EAP_PWD
            - LEAP
            - EAP_MD5
            - EAP_GTC
            - EAP_MSCHAPv2
            - EAP_OTP
            - UNKNOWN

    # =============================================================================
    # TEST CREDENTIAL TYPES
    # =============================================================================
    TestCredentialType:
        docs: |
            Type of test credentials used for association attempts.
            Determines the authentication method to use.
        enum:
            - NONE
            - PSK_SIMPLE
            - PSK_COMMON
            - EAP_GUEST
            - EAP_TEST_IDENTITY
            - EAP_CERTIFICATE
            - WEP_DEFAULT_KEY
            - CAPTIVE_PORTAL_BYPASS

    TestClientProfile:
        docs: |
            Controlled asset identity for test association attempts.
            Contains credentials appropriate for the target security configuration.
        properties:
            profileId: string
            profileName: optional<string>
            credentialType: TestCredentialType
            psk: optional<string>
            eapIdentity: optional<string>
            eapPassword: optional<string>
            eapCertificatePath: optional<string>
            wepKey: optional<string>

    # =============================================================================
    # ASSOCIATION OUTCOME
    # =============================================================================
    AssociationOutcome:
        docs: |
            High-level outcome categories for association attempts.
        enum:
            - SUCCESS
            - AUTH_FAILED
            - ASSOC_FAILED
            - NO_DHCP
            - DHCP_TIMEOUT
            - CAPTIVE_PORTAL_DETECTED
            - TIMEOUT
            - NETWORK_NOT_FOUND
            - SECURITY_MISMATCH
            - DRIVER_ERROR
            - PERMISSION_DENIED
            - INTERFACE_ERROR
            - UNKNOWN_ERROR

    # =============================================================================
    # CONFIG, RESULT, REPORT STRUCTS (Top-Level API Pattern)
    # =============================================================================
    ValidateAssociationConfig:
        docs: |
            Configuration for active association validation.
            Specifies target network and test client profile to use.
        properties:
            interface: optional<string>
            targetSsid: optional<string>
            targetBssid: optional<string>
            testClientProfileRef: optional<string>
            testCredentials: optional<list<TestClientProfile>>
            timeout: optional<integer>
            expectedSecurity: optional<SecurityExpectation>
            breakAndRemakeWifiAssociation: optional<boolean>

    SecurityExpectation:
        docs: |
            Expected security configuration for validation.
            Used to compare against negotiated security.
        properties:
            authenticationMethod: optional<wireless.AuthenticationMethod>
            encryptionProtocol: optional<wireless.EncryptionProtocol>
            wpaVersion: optional<wireless.WpaVersion>
            pmfPolicy: optional<wireless.PmfPolicy>
            requiresAuthentication: optional<boolean>

    ValidateAssociationResult:
        docs: |
            Result of association validation containing all attempt outcomes.
        properties:
            attempts: optional<list<AssociationAttempt>>
            findings: optional<list<Finding>>
            originalNetworkRestored: optional<boolean>
            originalNetwork: optional<OriginalNetworkState>

    ValidateAssociationReport:
        docs: |
            Complete report for association validation including config, results, and errors.
        properties:
            config: ValidateAssociationConfig
            result: ValidateAssociationResult
            errors: optional<list<string>>

    # =============================================================================
    # ORIGINAL NETWORK STATE (for break-and-remake logic)
    # =============================================================================
    OriginalNetworkState:
        docs: |
            Captures the state of the original WiFi connection before validation.
            Used to restore connection after validation completes.
        properties:
            ssid: optional<string>
            bssid: optional<string>
            wasConnected: boolean
            restoredSuccessfully: optional<boolean>
            restoreError: optional<string>

    # =============================================================================
    # ASSOCIATION ATTEMPT
    # =============================================================================
    AssociationAttempt:
        docs: |
            Record of a single association attempt including timing, outcome,
            and negotiated security properties.
        properties:
            ssid: optional<string>
            bssid: optional<string>
            startTime: datetime
            endTime: optional<datetime>
            outcome: AssociationOutcome
            statusCode: optional<AssociationStatusCode>
            statusCodeRaw: optional<integer>
            negotiatedSecurity: optional<NegotiatedSecurity>
            ipAcquired: optional<boolean>
            ipAddress: optional<string>
            dhcpServer: optional<string>
            gateway: optional<string>
            dnsServers: optional<list<string>>
            portalDetected: optional<boolean>
            portalUrl: optional<string>
            signalQualityAtAttempt: optional<integer>
            eapMethodNegotiated: optional<EapMethod>
            credentialTypeUsed: optional<TestCredentialType>
            errorMessage: optional<string>

    NegotiatedSecurity:
        docs: |
            Security configuration actually negotiated during association.
            May differ from advertised security.
        properties:
            authenticationMethod: optional<wireless.AuthenticationMethod>
            encryptionProtocol: optional<wireless.EncryptionProtocol>
            pairwiseCipher: optional<wireless.CipherSuite>
            groupCipher: optional<wireless.CipherSuite>
            keyManagement: optional<wireless.KeyManagementType>
            wpaVersion: optional<wireless.WpaVersion>
            pmfNegotiated: optional<boolean>
            eapMethod: optional<EapMethod>

    # =============================================================================
    # FINDINGS
    # =============================================================================
    FindingSeverity:
        enum:
            - INFO
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL

    FindingCategory:
        enum:
            - SECURITY_WEAKNESS
            - CONFIGURATION_ISSUE
            - POLICY_VIOLATION
            - UNEXPECTED_BEHAVIOR
            - ACCESS_CONTROL_BYPASS

    Finding:
        docs: |
            Security finding generated from association validation.
            Identifies gaps between advertised and actual security posture.
        properties:
            id: string
            title: string
            description: optional<string>
            severity: FindingSeverity
            category: FindingCategory
            evidence: optional<string>
            recommendation: optional<string>
            relatedBssid: optional<string>
            relatedSsid: optional<string>
