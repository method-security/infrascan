default-group: local
groups:
  local:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.46.4
        config:
          importPath: github.com/Method-Security/infrascan/generated/go
          retryStatusCodes: legacy
        output:
          location: local-file-system
          path: ../generated/go
        smart-casing: false
  pypi-local:
    generators:
      - name: fernapi/fern-pydantic-model
        version: 1.11.2
        output:
          location: local-file-system
          path: ../generated/python
        smart-casing: false
  pypi-test:
    generators:
      - name: fernapi/fern-pydantic-model
        version: 1.11.2
        config:
          package_name: methodinfrascan
        output:
          location: pypi
          package-name: methodinfrascan
          token: ${TEST_PYPI_TOKEN}
          url: https://test.pypi.org/legacy/
        smart-casing: false
  pypi:
    generators:
      - name: fernapi/fern-pydantic-model
        version: 1.11.2
        config:
          package_name: methodinfrascan
        output:
          location: pypi
          package-name: methodinfrascan
          token: ${PYPI_TOKEN}
        smart-casing: false
